# Copy to <PZ cachedir>/WorkshopSentinel/<serverName>/WorkshopSentinel.properties.
# Override with -Dworkshopsentinel.config=/absolute/path/WorkshopSentinel.properties
dryRun=true
shutdownEnabled=false
# At server startup, omit only WorkshopSentinel from the required client mod list.
clientOptional=true
shutdownAdapter=marker
provider=steam
checkIntervalSeconds=300
playerPollSeconds=60
maxWaitSeconds=1800
countdownSeconds=300
tickMillis=1000
httpTimeoutSeconds=20
# Relative paths are relative to this configuration file, not the working directory.
# Empty serverIni uses <cachedir>/Server/<serverName>.ini (default name servertest).
serverIni=
# Optional explicit IDs (semicolon-separated); otherwise read WorkshopItems from serverIni.
workshopIds=
# noop: no updates; file: simulated update IDs in triggerFile; steam: public Steam API.
triggerFile=simulate-update.txt
markerFile=restart-marker.properties
# Optional VERIFIED installed revision map: id=time_updated (Unix seconds).
# Empty: first successful Steam response is an in-memory baseline for this JVM session.
installedBaselineFile=
# Optional integration: serverpanelbridge delegates restart through Bridge public API v1.
# Requires shutdownEnabled=true, dryRun=false and Bridge restartEnabled=true / restartRequesters=WorkshopSentinel.
# No fallback shutdown or process launch if Bridge rejects or is unavailable.
